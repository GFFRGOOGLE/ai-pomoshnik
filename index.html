<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Помощник — спроси что угодно</title>
<meta name="description" content="Умный помощник: отвечает на любые вопросы. Плюс форма — написать автору.">
<meta name="theme-color" content="#0A0F1E">
<style>
  :root{
    --bg:#0A0F1E; --bg2:#0F1730; --panel:rgba(255,255,255,.05); --line:rgba(255,255,255,.10);
    --txt:#EAF0FF; --dim:#96A3C4; --cyan:#22D3EE; --violet:#8B5CF6; --pink:#EC4899; --ok:#34D399;
    --shadow:0 18px 50px rgba(0,0,0,.45);
  }
  html[data-theme="light"]{
    --bg:#F2F5FC; --bg2:#E7ECF9; --panel:rgba(255,255,255,.85); --line:rgba(16,24,48,.10);
    --txt:#0F1730; --dim:#5A6787; --shadow:0 18px 40px rgba(16,24,48,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font:16px/1.6 "Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(60vw 60vw at 12% -10%, rgba(139,92,246,.20), transparent 60%),
      radial-gradient(50vw 50vw at 100% 0%, rgba(34,211,238,.16), transparent 55%);
  }
  header{
    position:relative; z-index:2; display:flex; align-items:center; gap:12px;
    padding:14px 18px; border-bottom:1px solid var(--line); backdrop-filter:blur(10px);
  }
  .logo{width:38px; height:38px; border-radius:12px; flex:none;
    background:linear-gradient(135deg,var(--violet),var(--cyan)); display:grid; place-items:center;
    font-weight:800; color:#06111F; font-size:15px}
  .ttl{font-weight:700; font-size:17px; line-height:1.15}
  .sub{font-size:12.5px; color:var(--dim)}
  .grow{flex:1}
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
  .icb{
    width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--panel);
    display:grid; place-items:center; font-size:17px; transition:.15s;
  }
  .icb:hover{transform:translateY(-1px); border-color:rgba(139,92,246,.55)}
  main{position:relative; z-index:2; flex:1; display:flex; flex-direction:column; min-height:0}
  #chat{flex:1; overflow-y:auto; padding:20px 18px 8px; display:flex; flex-direction:column; gap:14px}
  .msg{display:flex; gap:11px; max-width:900px; width:100%; margin:0 auto}
  .av{width:34px; height:34px; border-radius:11px; flex:none; display:grid; place-items:center;
    font-size:12px; font-weight:800; color:#06111F; background:linear-gradient(135deg,var(--cyan),var(--violet))}
  .msg.me{flex-direction:row-reverse}
  .msg.me .av{background:linear-gradient(135deg,var(--pink),var(--violet)); color:#fff}
  .bub{border-radius:18px; padding:13px 17px; font-size:15.5px; line-height:1.68;
    background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow);
    word-break:break-word; white-space:pre-wrap; max-width:min(100%,760px)}
  .msg.ai .bub{border-top-left-radius:6px}
  .msg.me .bub{border-top-right-radius:6px; background:linear-gradient(135deg,var(--violet),var(--cyan)); color:#06111F; font-weight:500}
  .src{display:block; margin-top:8px; font-size:12px; color:var(--dim)}
  .dots{display:inline-flex; gap:6px; padding:3px 0}
  .dots i{width:8px; height:8px; border-radius:50%; background:var(--cyan); animation:bl 1.1s infinite}
  .dots i:nth-child(2){animation-delay:.16s; background:var(--violet)}
  .dots i:nth-child(3){animation-delay:.32s; background:var(--pink)}
  @keyframes bl{0%,100%{opacity:.35; transform:translateY(0)}50%{opacity:1; transform:translateY(-3px)}}
  #typing .bub{display:flex; align-items:center; gap:11px}
  .tstate{font-size:13.5px; opacity:.75}
  .intro{text-align:center; margin:auto; max-width:620px; padding:10px 4px 26px}
  .intro h1{font-size:clamp(24px,5vw,36px); line-height:1.18; margin:0 0 12px}
  .intro h1 span{background:linear-gradient(135deg,var(--cyan),var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .intro p{color:var(--dim); margin:0 0 18px}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px}
  .card{padding:13px 15px; border-radius:15px; border:1px solid var(--line); background:var(--panel);
    text-align:left; font-size:14px; transition:.15s}
  .card:hover{transform:translateY(-2px); border-color:rgba(139,92,246,.5)}
  .composer{position:relative; z-index:2; padding:10px 18px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:linear-gradient(to top,var(--bg),transparent)}
  .cin{display:flex; gap:10px; align-items:flex-end; max-width:900px; margin:0 auto}
  textarea{
    flex:1; resize:none; min-height:50px; max-height:170px; padding:14px 16px; font:inherit;
    color:var(--txt); background:var(--panel); border:1px solid var(--line); border-radius:15px; outline:none;
  }
  textarea:focus{border-color:rgba(139,92,246,.6)}
  .send{width:50px; height:50px; border-radius:15px; flex:none; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--violet),var(--cyan)); color:#06111F; transition:.15s}
  .send:hover{transform:translateY(-2px)}
  .send.busy{opacity:.55; cursor:progress}
  #toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:9;
    background:#0F1730; color:#EAF0FF; border:1px solid var(--line); border-radius:13px;
    padding:11px 16px; font-size:14px; box-shadow:var(--shadow); max-width:92vw; text-align:center;
  }
  .sheet{
    position:fixed; inset:0; z-index:20; display:none; place-items:center; padding:16px;
    background:rgba(4,8,18,.6); backdrop-filter:blur(3px);
  }
  .sheet.on{display:grid}
  .panel{width:min(560px,100%); max-height:88vh; overflow:auto; background:var(--bg2); color:var(--txt);
    border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow:var(--shadow)}
  .panel h2{margin:0 0 14px; font-size:19px}
  .panel label{display:block; font-size:13px; color:var(--dim); margin:12px 0 6px}
  .panel select,.panel input,.panel textarea{
    width:100%; padding:11px 13px; font:inherit; color:var(--txt); background:var(--panel);
    border:1px solid var(--line); border-radius:12px; outline:none;
  }
  .panel textarea{min-height:110px; resize:vertical}
  .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}
  .btn{padding:11px 17px; border-radius:13px; border:1px solid var(--line); background:var(--panel); font-size:14.5px}
  .btn.main{background:linear-gradient(135deg,var(--violet),var(--cyan)); color:#06111F; font-weight:700; border:0}
  .note{margin-top:14px; font-size:12.5px; color:var(--dim); line-height:1.55}
  .ok{color:var(--ok)}
  footer{position:relative; z-index:2; text-align:center; font-size:12px; color:var(--dim); padding:0 16px 14px}
</style>
</head>
<body>

<header>
  <div class="logo">AI</div>
  <div>
    <div class="ttl">Помощник</div>
    <div class="sub" id="modeTxt">Готов отвечать</div>
  </div>
  <div class="grow"></div>
  <button class="icb" id="themeBtn" title="Сменить тему">🌙</button>
  <button class="icb" id="writeBtn" title="Написать автору">✉️</button>
  <button class="icb" id="cfgBtn" title="Настройки">⚙️</button>
</header>

<main>
  <div id="chat"></div>
</main>

<div class="composer">
  <div class="cin">
    <textarea id="ask" rows="1" placeholder="Спроси что угодно… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
    <button class="send" id="send" title="Отправить">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 16-8-6 16-2.5-6.5L4 12z"/></svg>
    </button>
  </div>
</div>
<footer>Помощник может ошибаться — важное перепроверяй.</footer>

<div id="toast" hidden></div>

<!-- Настройки -->
<div class="sheet" id="cfgSheet">
  <div class="panel">
    <h2>⚙️ Настройки</h2>
    <label for="mode">Режим</label>
    <select id="mode">
      <option value="free">🧠 Бесплатный ИИ (без ключа)</option>
      <option value="key">🔑 Свой API-ключ</option>
    </select>
    <div id="keyFields" style="display:none">
      <label for="prov">Сервис</label>
      <select id="prov">
        <option value="groq">Groq (gsk_…)</option>
        <option value="openrouter">OpenRouter (sk-or-…)</option>
        <option value="gemini">Google Gemini (AIza…)</option>
      </select>
      <label for="key">Ключ</label>
      <input id="key" type="password" placeholder="вставь ключ" autocomplete="off">
      <label for="mdl">Модель (можно не заполнять)</label>
      <input id="mdl" type="text" placeholder="модель">
    </div>
    <div class="row">
      <button class="btn main" id="saveCfg">Сохранить</button>
      <button class="btn" id="closeCfg">Закрыть</button>
    </div>
    <div class="note">Ключ хранится только в этом браузере и никуда не отправляется, кроме самого сервиса.</div>
  </div>
</div>

<!-- Написать автору -->
<div class="sheet" id="writeSheet">
  <div class="panel">
    <h2>✉️ Написать автору</h2>
    <p class="note" style="margin-top:0">Сообщение придёт автору в Telegram. Ответ придёт туда же, если оставишь способ связи.</p>
    <label for="wName">Как тебя зовут (не обязательно)</label>
    <input id="wName" type="text" placeholder="имя" maxlength="40">
    <label for="wText">Сообщение</label>
    <textarea id="wText" placeholder="Что хочешь передать?" maxlength="900"></textarea>
    <div class="row">
      <button class="btn main" id="sendLetter">Отправить</button>
      <button class="btn" id="closeWrite">Закрыть</button>
    </div>
    <div class="note" id="writeNote"></div>
  </div>
</div>

<script>
/* ===========================================================================
   ПОМОЩНИК — один HTML-файл, без сервера.
   • отвечает бесплатный ИИ (без ключа), с повторами при отказах;
   • если у человека есть свой ключ — можно переключиться в настройках;
   • кнопка «✉️» отправляет сообщение автору через открытый канал ntfy.sh
     (токенов и секретов в странице нет).
   =========================================================================== */

/* ------------------------------- настройки ------------------------------- */
const SYSTEM_PROMPT =
  'Ты — дружелюбный и понятный помощник. Отвечай по-русски, простыми словами, '
  + 'без лишней воды. Сначала дай прямой ответ, потом коротко поясни. '
  + 'Если вопрос про учёбу — объясни так, чтобы понял школьник 7–9 класса. '
  + 'Если чего-то не знаешь или вопрос спорный — скажи честно, не выдумывай. '
  + 'Не используй Markdown-разметку со звёздочками, пиши обычным текстом.';

const PROVIDERS = {
  groq:       { name:'Groq', url:'https://api.groq.com/openai/v1/chat/completions', model:'llama-3.3-70b-versatile', style:'openai' },
  openrouter: { name:'OpenRouter', url:'https://openrouter.ai/api/v1/chat/completions', model:'meta-llama/llama-3.3-70b-instruct:free', style:'openai' },
  gemini:     { name:'Google Gemini', url:'https://generativelanguage.googleapis.com/v1beta/models/', model:'gemini-2.0-flash', style:'gemini' }
};
const FREE_URL = 'https://text.pollinations.ai/openai';
const FREE_GET = 'https://text.pollinations.ai/';
const FREE_MODELS = ['openai', 'openai-fast'];
const SERVICE_TEXT = /credits|top up|not enough|pollinations|api key|contact whoever|quests|queue full|rate limit/i;

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));

let cfg = { mode:'free', provider:'groq', key:'', model:'' };
let history = [];        /* [{role, text}] — для контекста разговора */
let busy = false;

/* ------------------------------- оформление ------------------------------ */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  $('themeBtn').textContent = t === 'light' ? '☀️' : '🌙';
  try { localStorage.setItem('helper_theme', t); } catch (e){}
}
$('themeBtn').onclick = () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
};
try { applyTheme(localStorage.getItem('helper_theme') || 'dark'); } catch (e){ applyTheme('dark'); }

/* --------------------------------- чат ----------------------------------- */
function bubble(role, text, src){
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'me' : 'ai');
  el.innerHTML = '<div class="av">' + (role === 'user' ? 'Я' : 'AI') + '</div><div class="bub"></div>';
  const b = el.querySelector('.bub');
  b.textContent = text;
  if (src){
    const s = document.createElement('span');
    s.className = 'src'; s.textContent = src; b.appendChild(s);
  }
  $('chat').appendChild(el);
  $('chat').scrollTop = $('chat').scrollHeight;
}
function typingOn(){
  const el = document.createElement('div');
  el.className = 'msg ai'; el.id = 'typing';
  el.innerHTML = '<div class="av">AI</div><div class="bub">'
    + '<span class="dots"><i></i><i></i><i></i></span>'
    + '<span class="tstate" id="tstate">Секунду, думаю…</span></div>';
  $('chat').appendChild(el);
  $('chat').scrollTop = $('chat').scrollHeight;
}
function typingOff(){ const t = $('typing'); if (t) t.remove(); }
function typingSay(m){ const t = $('tstate'); if (t) t.textContent = m; }

let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}
function hideToast(){ $('toast').hidden = true; clearTimeout(toastTimer); }

function showIntro(){
  const el = document.createElement('div');
  el.className = 'intro'; el.id = 'intro';
  el.innerHTML = '<h1>Спроси что угодно<br><span>я помогу</span></h1>'
    + '<p>Учёба, объяснения, идеи, тексты, планы — пиши своими словами. Отвечаю сразу.</p>'
    + '<div class="cards">'
    + ['Объясни простыми словами, почему идёт дождь',
       'Помоги решить: у Пети было 3 яблока, он отдал 1 — сколько осталось?',
       'Придумай 5 идей для школьного проекта',
       'Как запомнить таблицу умножения быстрее?'].map(t =>
        '<button class="card">' + t + '</button>').join('')
    + '</div>';
  $('chat').appendChild(el);
  el.querySelectorAll('.card').forEach(b => b.onclick = () => {
    $('ask').value = b.textContent; autoGrow(); send(b.textContent);
  });
}
function hideIntro(){ const i = $('intro'); if (i) i.remove(); }

function autoGrow(){
  const a = $('ask'); a.style.height = 'auto'; a.style.height = Math.min(a.scrollHeight, 170) + 'px';
}

/* ------------------------------- бесплатный ИИ --------------------------- */
function chatMessages(text){
  const h = history.slice(-6).map(m => ({ role: m.role, content: m.text }));
  h.push({ role:'user', content: text });
  return h;
}
function withTimeout(fn, ms){
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fn(c.signal).finally(() => clearTimeout(t));
}

async function askFreeAI(text, onProgress){
  let lastErr = new Error('бесплатный ИИ недоступен');
  const tries = [
    { model:'openai',      viaGet:false },
    { model:'openai-fast', viaGet:false },
    { model:'openai',      viaGet:true  }
  ];
  const started = Date.now(), BUDGET = 45000;
  let attempt = 0;
  for (let round = 1; round <= 3; round++){
    for (const t of tries){
      if (Date.now() - started > BUDGET){ lastErr = new Error('время ожидания вышло'); break; }
      attempt++;
      if (attempt > 1 && onProgress) onProgress(attempt);
      try {
        return await withTimeout(async (signal) => {
          let out = '';
          if (t.viaGet){
            const r = await fetch(FREE_GET + encodeURIComponent(text)
              + '?model=' + encodeURIComponent(t.model)
              + '&system=' + encodeURIComponent(SYSTEM_PROMPT), { signal });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            out = (await r.text()).trim();
          } else {
            const r = await fetch(FREE_URL, {
              method:'POST', headers:{ 'Content-Type':'application/json' }, signal,
              body: JSON.stringify({
                model: t.model,
                messages: [{ role:'system', content: SYSTEM_PROMPT }, ...chatMessages(text)],
                temperature: 0.7
              })
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const j = await r.json();
            out = (j.choices?.[0]?.message?.content || '').trim();
          }
          if (!out) throw new Error('пустой ответ');
          if (SERVICE_TEXT.test(out)) throw new Error('сервис недоступен');
          return out;
        }, 15000);
      } catch (e){ lastErr = e; }
    }
    if (Date.now() - started > BUDGET) break;
    if (round < 3) await wait(round * 1200);
  }
  throw lastErr;
}

async function askKeyAI(text){
  const p = PROVIDERS[cfg.provider];
  const model = cfg.model || p.model;
  const msgs = chatMessages(text);
  return withTimeout(async (signal) => {
    if (p.style === 'gemini'){
      const url = p.url + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(cfg.key);
      const r = await fetch(url, {
        method:'POST', headers:{ 'Content-Type':'application/json' }, signal,
        body: JSON.stringify({ systemInstruction:{ parts:[{ text:SYSTEM_PROMPT }] },
          contents: msgs.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts:[{ text:m.content }] })) })
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      const out = (j.candidates?.[0]?.content?.parts || []).map(x => x.text || '').join('').trim();
      if (!out) throw new Error('пустой ответ');
      return out;
    }
    const r = await fetch(p.url, {
      method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + cfg.key }, signal,
      body: JSON.stringify({ model, messages:[{ role:'system', content:SYSTEM_PROMPT }, ...msgs], temperature:0.7 })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const out = (j.choices?.[0]?.message?.content || '').trim();
    if (!out) throw new Error('пустой ответ');
    return out;
  }, 30000);
}

/* --------------------------------- ответ --------------------------------- */
async function send(text){
  text = (text || '').trim();
  if (busy){ toast('Уже отвечаю — подожди чуть-чуть, ответ скоро появится.'); return; }
  if (!text){ toast('Напиши вопрос — например «объясни, что такое фотосинтез».'); return; }
  busy = true; $('send').classList.add('busy'); hideToast(); hideIntro();

  bubble('user', text);
  history.push({ role:'user', text });
  $('ask').value = ''; autoGrow();
  typingOn();
  typingSay('Секунду, думаю…');

  let reply = null, src = '', usedFallback = false;
  try {
    reply = (cfg.mode === 'key' && cfg.key)
      ? await askKeyAI(text)
      : await askFreeAI(text, n => typingSay(n === 2
          ? 'Сервис ответил не сразу — пробую ещё раз…'
          : 'Пробую другой способ… (попытка ' + n + ')'));
    if (cfg.mode !== 'key') src = 'ответ ИИ';
  } catch (e){
    if (cfg.mode === 'free' && cfg.key){
      try { reply = await askKeyAI(text); src = 'ответ ИИ (через твой ключ)'; } catch (e2){ reply = null; }
    }
    if (reply === null){
      usedFallback = true;
      reply = 'Не получилось получить ответ: бесплатный сервис перегружен и не ответил за 45 секунд.\n\n'
        + 'Что можно сделать:\n'
        + '• подожди минуту и спроси ещё раз — обычно со второй попытки получается;\n'
        + '• если так часто — нажми ⚙️ и вставь свой ключ, он работает надёжнее.';
    }
  }
  typingOff();
  bubble('assistant', reply, src);
  history.push({ role:'assistant', text: reply });
  busy = false; $('send').classList.remove('busy'); $('ask').focus();
  if (usedFallback) $('modeTxt').textContent = 'ИИ сейчас перегружен';
}

/* ------------------------------ настройки ИИ ----------------------------- */
function loadCfg(){
  try {
    const raw = localStorage.getItem('helper_cfg');
    if (raw) cfg = Object.assign(cfg, JSON.parse(raw));
  } catch (e){}
  $('mode').value = cfg.mode; $('prov').value = cfg.provider;
  $('key').value = cfg.key; $('mdl').value = cfg.model;
  $('keyFields').style.display = cfg.mode === 'key' ? '' : 'none';
}
$('mode').onchange = () => { $('keyFields').style.display = $('mode').value === 'key' ? '' : 'none'; };
$('cfgBtn').onclick = () => $('cfgSheet').classList.add('on');
$('closeCfg').onclick = () => $('cfgSheet').classList.remove('on');
$('saveCfg').onclick = () => {
  cfg = { mode: $('mode').value, provider: $('prov').value, key: $('key').value.trim(), model: $('mdl').value.trim() };
  try { localStorage.setItem('helper_cfg', JSON.stringify(cfg)); } catch (e){}
  $('cfgSheet').classList.remove('on');
  $('modeTxt').textContent = cfg.mode === 'key' && cfg.key
    ? 'ИИ: ' + PROVIDERS[cfg.provider].name
    : 'Готов отвечать';
};

/* ------------------------- сообщение автору (ntfy) ------------------------ */
const RELAY_TOPIC = 'gffr-pismo-e1697d6b0677';
const RELAY_URL = 'https://ntfy.sh/' + RELAY_TOPIC;

$('writeBtn').onclick = () => { $('writeNote').textContent = ''; $('writeSheet').classList.add('on'); };
$('closeWrite').onclick = () => $('writeSheet').classList.remove('on');

$('sendLetter').onclick = async () => {
  const name = $('wName').value.trim();
  const text = $('wText').value.trim();
  if (text.length < 2){ $('writeNote').textContent = 'Напиши сообщение.'; return; }
  const btn = $('sendLetter');
  btn.textContent = 'Отправляю…'; btn.disabled = false;
  try {
    /* ВАЖНО: заголовки запроса должны быть ASCII. Русский текст в заголовке
       браузер запрещает и запрос вообще не уходит — поэтому всё в теле письма. */
    const r = await fetch(RELAY_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain; charset=utf-8' },
      body: 'Новое сообщение с сайта «Помощник»\n'
        + 'От: ' + (name || 'не указано') + '\n'
        + '---\n'
        + text
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    $('writeNote').innerHTML = '<span class="ok">Отправлено! Автор увидит сообщение.</span>';
    $('wText').value = ''; $('wName').value = '';
    setTimeout(() => $('writeSheet').classList.remove('on'), 1200);
  } catch (e){
    if (window.console) console.warn('письмо не ушло:', e && e.message);
    $('writeNote').textContent = 'Не получилось отправить. Проверь интернет и попробуй ещё раз.';
  } finally {
    btn.textContent = 'Отправить';
  }
};

/* -------------------------------- запуск --------------------------------- */
$('send').onclick = () => send($('ask').value);
$('ask').addEventListener('input', autoGrow);
$('ask').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send($('ask').value); }
});
loadCfg();
showIntro();
$('ask').focus();
</script>
